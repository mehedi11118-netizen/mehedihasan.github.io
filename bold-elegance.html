<style>

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: #f6f3ed;
  color: #25221e;
  font-family: Arial, sans-serif;
  line-height: 1.7;
}

header {
  padding: 25px 7%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #ded9cf;
}

header a {
  color: #25221e;
  text-decoration: none;
  font-size: 11px;
  letter-spacing: 2px;
}

header a:hover,
footer a:hover {
  color: #927b61;
}

.hero {
  padding: 110px 7% 90px;
  text-align: center;
}

.hero p {
  font-size: 10px;
  letter-spacing: 4px;
  color: #927b61;
  margin: 20px 0;
}

h1 {
  font-family: Georgia, serif;
  font-size: clamp(48px, 9vw, 100px);
  font-weight: normal;
  letter-spacing: 2px;
  line-height: 1.1;
  margin: 25px 0;
}

.subtitle {
  font-family: Georgia, serif;
  font-size: clamp(17px, 2.5vw, 23px);
  color: #776c60;
  font-style: italic;
}

.gallery {
  padding: 20px 7% 80px;
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: 55px 22px;
  align-items: start;
}

.gallery img {
  width: 100%;
  height: auto;
  display: block;
  background: #e8e2d8;
  box-shadow: 0 8px 25px rgba(40, 30, 20, 0.07);
  transition: transform 0.4s ease, box-shadow 0.4s ease;
}

.gallery img:hover {
  transform: translateY(-5px);
  box-shadow: 0 15px 35px rgba(40, 30, 20, 0.13);
}

/* Editorial image arrangement */

.gallery img:nth-child(1) {
  grid-column: 2 / 12;
  width: 85%;
  justify-self: center;
  margin-bottom: 25px;
}

.gallery img:nth-child(4n + 2) {
  grid-column: 1 / 8;
}

.gallery img:nth-child(4n + 3) {
  grid-column: 8 / 13;
  margin-top: 65px;
}

.gallery img:nth-child(4n + 4) {
  grid-column: 2 / 7;
}

.gallery img:nth-child(4n + 5) {
  grid-column: 7 / 13;
  margin-top: 55px;
}

footer {
  text-align: center;
  padding: 65px 20px;
  border-top: 1px solid #ded9cf;
  margin-top: 30px;
}

footer p {
  font-family: Georgia, serif;
  margin: 8px;
}

footer a {
  display: inline-block;
  margin-top: 15px;
  color: #776c60;
  text-decoration: none;
  font-size: 12px;
}

@media(max-width: 650px) {
  header {
    padding: 20px 6%;
  }

  header a {
    font-size: 9px;
    letter-spacing: 1px;
  }

  .hero {
    padding: 70px 6%;
  }

  .gallery {
    padding: 15px 6% 50px;
    grid-template-columns: 1fr;
    gap: 25px;
  }

  .gallery img,
  .gallery img:nth-child(n) {
    grid-column: 1;
    width: 100%;
    margin: 0;
  }

  footer {
    padding: 45px 15px;
  }
}

</style>
